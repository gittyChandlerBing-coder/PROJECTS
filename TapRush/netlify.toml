# ── Redirect: force canonical domain
[[redirects]]
  from   = "https://taprush.netlify.app/*"
  to     = "https://rushtap.netlify.app/:splat"
  status = 301
  force  = true

# ── Global headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Cache-Control          = "public, max-age=3600"
    # Allow itch.io to embed your site
    X-Frame-Options        = "ALLOW-FROM https://itch.io"
    Content-Security-Policy = "frame-ancestors 'self' https://itch.io https://*.itch.io"

# ── Cache favicons/images longer
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
